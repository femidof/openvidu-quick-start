name: video_test
description: Example app that uses LiveKit Flutter SDK
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  animated_text_kit: ^4.2.2
  collection: ">=1.16.0"
  dropdown_button2: ^2.3.6
  flutter:
    sdk: flutter
  flutter_background: ^1.1.0
  flutter_svg: ^2.0.5
  flutter_window_close: ^1.0.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  livekit_client: 2.3.4+hotfix.2
  logging: ^1.0.1
  permission_handler: ^11.3.1
  provider: ^6.0.1
  shared_preferences: ^2.0.7

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  uses-material-design: true
  assets:
    - images/logo-dark.svg
